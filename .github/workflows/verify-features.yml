name: Verify Features

on:
  # Twice weekly - Monday and Thursday at 6pm Pacific (Tue/Fri 01:00 UTC)
  schedule:
    - cron: '0 1 * * 2,5'

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to verify (leave empty for all)'
        required: false
        type: string
      stale_only:
        description: 'Only verify stale features'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no issues/PRs created)'
        required: false
        type: boolean
        default: false
      max_features:
        description: 'Maximum features to verify'
        required: false
        type: number
        default: 50
      auto_resolve:
        description: 'Run the Claude auto-resolve agent (edits data/ and commits)'
        required: false
        type: boolean
        default: false

jobs:
  verify:
    name: Verify Feature Data
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      # claude-code-action mints its GitHub token via OIDC. Without this the
      # auto-resolve step dies with "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build verification arguments
        id: args
        run: |
          ARGS=""
          if [ -n "${{ inputs.platform }}" ]; then
            ARGS="$ARGS --platform ${{ inputs.platform }}"
          fi
          if [ "${{ inputs.stale_only }}" = "true" ]; then
            ARGS="$ARGS --stale-only"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.max_features }}" ]; then
            ARGS="$ARGS --max ${{ inputs.max_features }}"
          else
            ARGS="$ARGS --max 50"
          fi
          ARGS="$ARGS --verbose"
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run feature verification
        id: verify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/verify-features.js ${{ steps.args.outputs.args }}
        continue-on-error: true

      - name: Publish run summary
        if: always()
        run: |
          # Surface the verification report in the Actions job summary so
          # outcomes are visible without reading raw logs.
          {
            echo "## Verification run summary"
            echo ""
            if [ "${{ steps.verify.outcome }}" = "failure" ]; then
              echo "> ⚠️ **verify-features.js exited nonzero** (confirmed changes/contradictions found, or the script errored). See logs and issues."
              echo ""
            fi
            REPORT=$(ls -t .verification-reports/*.md 2>/dev/null | head -1)
            if [ -n "$REPORT" ]; then
              head -100 "$REPORT"
            else
              echo "_No verification report was generated — the script may have failed early._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.verify.outcome }}" = "failure" ]; then
            echo "::warning::verify-features.js exited nonzero — check the run summary and open issues."
          fi

      - name: Commit updated dates
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data/platforms/ data/watchlist/; then
            echo "No date changes to commit"
          else
            git add data/platforms/ data/watchlist/
            git commit -m "Update Checked/Verified dates [skip ci]"
          fi

      - name: Count open issues needing resolution
        id: issues
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh issue list --state open \
            --label "needs-review" \
            --json number --jq 'length')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT open issues needing resolution"

      # Gated to opt-in manual dispatch only.
      #
      # This step ran 5 times between 2026-03-25 and 2026-07-21 and failed all 5
      # (missing id-token: write, fixed above) — it has never completed a single
      # successful run. Until one supervised dispatch proves it behaves, it stays
      # off the schedule: it edits data/platforms/ autonomously and commits.
      # Once trusted, drop the event_name/auto_resolve conditions to re-arm it.
      - name: Auto-resolve verification issues
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.auto_resolve == true
          && inputs.dry_run != true
          && steps.issues.outputs.count > 0
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are resolving verification issues for AI Tool Watch.
            There are ${{ steps.issues.outputs.count }} open issues with the "needs-review" label.

            For each platform with open issues, run `/resolve-issue batch <platform>`.
            Process all platforms that have open issues. Work through them systematically.

            Start by listing all open issues:
            gh issue list --repo ${{ github.repository }} --state open --label "needs-review" --json number,title

            Then resolve them by platform. Be thorough but efficient — use batch mode.
          # allowed_tools is NOT a valid @v1 input — it was silently ignored,
          # so this step never actually ran under the tool restrictions it
          # appeared to declare. Tool permissions belong in claude_args.
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 30
            --allowedTools Bash,Read,Edit,Write,Grep,Glob,WebFetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

      - name: Commit resolution updates
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.auto_resolve == true
          && inputs.dry_run != true
          && steps.issues.outputs.count > 0
        run: |
          if git diff --quiet data/platforms/ data/watchlist/; then
            echo "No additional changes from issue resolution"
          else
            git add data/platforms/ data/watchlist/
            git commit -m "Auto-resolve verification issues [skip ci]"
          fi

      - name: Push all commits
        if: inputs.dry_run != true
        run: |
          # Single push at the end — pull first to handle any concurrent updates
          if [ "$(git rev-list --count @{u}..HEAD 2>/dev/null)" -gt 0 ]; then
            git pull --rebase
            git push
          else
            echo "No local commits to push"
          fi

      - name: Silence canary
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A monitoring pipeline whose healthy and dead states look identical
          # is unmonitorable. If automation has produced zero issues of any
          # kind for 21 days, flag it: either the world went suspiciously
          # quiet or the pipeline is over-suppressing signal again.
          SINCE=$(date -u -d '21 days ago' +%Y-%m-%d)
          RECENT=$(gh issue list --state all --limit 100 \
            --search "author:app/github-actions created:>=$SINCE" \
            --json number --jq 'length')
          echo "Automation issues created since $SINCE: $RECENT"

          if [ "$RECENT" -eq 0 ]; then
            OPEN_CANARY=$(gh issue list --state open --label "pipeline-canary" --json number --jq 'length')
            if [ "$OPEN_CANARY" -eq 0 ]; then
              gh label create "pipeline-canary" --color "5319e7" --description "Automation silence canary" 2>/dev/null || true
              gh issue create \
                --title "[Canary] No automated issues in 21+ days — pipeline may be over-suppressing" \
                --label "pipeline-canary" \
                --body "The verification pipeline has not filed a single automated issue (conflict, unconfirmed change, signals digest, staleness, broken links, or cascade health) since before $SINCE, while scheduled runs keep completing green.

          This is exactly the failure mode from June 2026: runs succeed, but the cascade discards every change signal, so silence looks identical to health.

          **Check:**
          1. Recent *Verify Features* run logs — are POSITIVE votes appearing and being discarded?
          2. The run summary line \`Positive votes discarded\` — nonzero values with zero issues filed means suppression.
          3. Whether the signals digest issue is being created/updated.

          Close this issue once you've confirmed the silence is genuine (no changes in the AI tool landscape) or fixed the suppression.

          ---
          *Automatically created by the silence canary in verify-features.yml.*"
              echo "::warning::Silence canary fired — no automation issues in 21+ days."
            else
              echo "Canary already open — not duplicating."
            fi
          else
            echo "Canary quiet: automation is producing issues."
          fi

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: .verification-reports/
          retention-days: 30

      - name: Check for required secrets
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::warning::Verification may have failed due to missing API keys."
          echo "Ensure these secrets are configured:"
          echo "  - GEMINI_API_KEY"
          echo "  - PERPLEXITY_API_KEY"
          echo "  - XAI_API_KEY"
          echo "  - ANTHROPIC_API_KEY"

  # Daily staleness check (lightweight)
  staleness-check:
    name: Check for Stale Features
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check staleness
        id: staleness
        run: |
          # Simple staleness check without API calls
          node -e "
            const { findStaleFeatures } = require('./scripts/lib/parser');
            const stale = findStaleFeatures(30);
            console.log('Found ' + stale.length + ' stale features');

            if (stale.length > 0) {
              console.log('\nStale features:');
              for (const { platform, feature, daysSinceChecked } of stale.slice(0, 10)) {
                console.log('  - ' + platform.name + ' → ' + feature.name + ' (' + daysSinceChecked + ' days)');
              }
              if (stale.length > 10) {
                console.log('  ... and ' + (stale.length - 10) + ' more');
              }
            }

            // Output for GitHub Actions
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'count=' + stale.length + '\n');
          "

      - name: Create staleness issue
        if: steps.staleness.outputs.count > 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create label if it doesn't exist (ignore errors)
          gh label create "verification-needed" --color "0e8a16" --description "Feature needs verification" 2>/dev/null || true

          gh issue create \
            --title "[Automated] ${{ steps.staleness.outputs.count }} features need verification" \
            --body "The twice-weekly staleness check found ${{ steps.staleness.outputs.count }} features that haven't been verified in over 7 days.

          Please run the full verification workflow or manually review these features.

          To run verification:
          1. Go to Actions → Verify Features
          2. Click 'Run workflow'
          3. Optionally check 'Only verify stale features'

          ---
          *This issue was automatically created by the staleness check.*" \
            --label "verification-needed"
